[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "beambench"
version = "0.1.0"
description = "Reproducible experiment utilities for beamforming and spatial-audio research."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "WonderfulClaire" }]
keywords = ["beamforming", "reproducible-research", "spatial-audio", "experiment-tracking"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.2",
]

[project.optional-dependencies]
dev = ["ruff>=0.15"]

[project.scripts]
beambench = "beambench.cli:main"

[project.urls]
Homepage = "https://github.com/WonderfulClaire/BeamBench"
Issues = "https://github.com/WonderfulClaire/BeamBench/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

